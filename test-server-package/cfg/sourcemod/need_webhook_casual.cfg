// Need Webhook configuration for a casual server

// Cooldown between successful !need uses, in seconds.
sm_needwebhook_cooldown "1200"

// Discord webhook URL.
sm_needwebhook_url "https://discord.com/api/webhooks/REPLACE_ME"

// Mode shown in the embed.
sm_needwebhook_mode "Casual"

// Plain Discord message text outside the embed.
sm_needwebhook_message "<@&1481752045018026116> Players needed for **Casual**."

// Webhook display name and profile picture.
sm_needwebhook_username "GlobalRetake Need Bot"
sm_needwebhook_avatar_url "https://globalretake.com/c864a7841c255b7fb829a33346c85e9c.png"

// Embed title/description templates.
// Available tokens: {CURRENT} {MAX} {MODE} {MAP} {CONNECT} {PLAYER}
sm_needwebhook_embed_title "Casual Need | {CURRENT}/{MAX} Players"
sm_needwebhook_embed_description "Mode: {MODE}\nMap: {MAP}"

// Embed color. Supports decimal, #RRGGBB, or 0xRRGGBB.
sm_needwebhook_embed_color "#5865F2"

// Text shown in the embed for joining the server.
sm_needwebhook_connect "connect 51.75.147.102:27016"

// Max player count shown in the embed.
// Set to 0 to auto-detect, or set a fixed value like 20.
sm_needwebhook_max_players "0"

// Base URL for map images. The plugin appends the selected map image name.
sm_needwebhook_image_base "https://globalretake.com/maps"

// File extension for the map image. Set this to png, jpg, jpeg, webp, etc.
sm_needwebhook_image_ext "png"

// Set to 1 to keep prefixes like de_ and cs_ in the image URL, or 0 to strip them.
sm_needwebhook_image_include_prefix "0"

// Embed field labels and values.
sm_needwebhook_status_label "Server"
sm_needwebhook_status_text "Casual"
sm_needwebhook_players_label "Players Online"
sm_needwebhook_connect_label "Connect Command"
sm_needwebhook_requester_label "Requested By"
sm_needwebhook_footer "globalretake.com | {CONNECT}"

// In-game announce text after a successful send.
sm_needwebhook_announce "[Need] Discord notification sent."
