// Need Webhook configuration
// This file is generated/used by addons/sourcemod/scripting/need_webhook.sp

// Cooldown between successful !need uses, in seconds.
sm_needwebhook_cooldown "1200"

// Discord webhook URL.
sm_needwebhook_url ""

// How the mode label is chosen.
// auto = detect from game_type/game_mode
// custom = always use sm_needwebhook_mode
sm_needwebhook_mode_source "auto"

// Fallback/custom mode shown in the embed.
sm_needwebhook_mode "Casual"

// Optional ping text sent above the normal !need message.
// Leave empty to disable pings entirely.
sm_needwebhook_ping "@everyone"

// Plain Discord message text for !need.
// Available tokens: {CURRENT} {MAX} {MODE} {MAP} {CONNECT} {PLAYER} {SERVER} {TAG}
sm_needwebhook_message "Players needed!"

// Send a non-ping webhook when the map changes.
sm_needwebhook_mapchange_enabled "1"

// Plain Discord message text used for map changes.
// Available tokens: {CURRENT} {MAX} {MODE} {MAP} {CONNECT} {PLAYER} {SERVER} {TAG}
sm_needwebhook_mapchange_message "Map changed to {MAP}"

// Webhook display name and profile picture.
sm_needwebhook_username "Need Bot"
sm_needwebhook_avatar_url ""

// Embed title/description templates.
// Available tokens: {CURRENT} {MAX} {MODE} {MAP} {CONNECT} {PLAYER} {SERVER} {TAG}
sm_needwebhook_embed_title "{CURRENT}/{MAX} - {MODE}"
sm_needwebhook_embed_description "{MAP}\n{CONNECT}"

// Embed color. Supports decimal, #RRGGBB, or 0xRRGGBB.
sm_needwebhook_embed_color "#5865F2"

// Text shown in the embed for joining the server.
sm_needwebhook_connect "connect 127.0.0.1:27015"

// Max player count shown in the embed.
// Set to 0 to auto-detect, or set a fixed value like 20.
sm_needwebhook_max_players "0"

// Server name field.
// Leave empty to use the server hostname automatically.
sm_needwebhook_server_name ""
sm_needwebhook_server_name_label "Server"

// Optional extra tag field, such as Official or Verified.
sm_needwebhook_tag ""
sm_needwebhook_tag_label "Tag"

// Base URL for map images. The plugin appends the selected map image name.
sm_needwebhook_image_base ""

// File extension for the map image. Set this to png, jpg, jpeg, webp, etc.
sm_needwebhook_image_ext "jpg"

// Set to 1 to keep prefixes like de_ and cs_ in the image URL, or 0 to strip them.
sm_needwebhook_image_include_prefix "1"

// Embed field labels and values.
sm_needwebhook_status_label "Status"
sm_needwebhook_status_text "Active"
sm_needwebhook_inactive_status_text "Inactive"
sm_needwebhook_players_label "Players"
sm_needwebhook_connect_label "Command to connect"
sm_needwebhook_requester_label "Needed by"
sm_needwebhook_footer "IP: {CONNECT}"

// Automatically edit the last webhook message as players join/leave.
sm_needwebhook_status_updates "1"

// Delay in seconds before sending a coalesced status/player-count update.
sm_needwebhook_status_update_delay "3.0"

// In-game announce text after a successful !need send.
sm_needwebhook_announce "Need message sent"
